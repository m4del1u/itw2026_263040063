<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background Attachment</title>
    <style>
        body {
            text-align: center;
            font-family: arial, helvetica, sans-serif;
            background-color: rgb(235, 13, 13);
            background-image: url(img/Frank\ Ocean.jpg);
            background-repeat: no-repeat;
            background-position: center;
            height: 2000vh;
        }


        .kotak {
            width: 400px;
            height: 300px;
            border:10px solid #333;
            margin: 20px auto;
            background-color: rgb(254, 105, 210);
            background-image: url(img/Artist.jpg);
            background-size: auto;
            background-repeat: no-repeat;
            overflow: auto;
            background-attachment: scroll;

        }

        .content {
            width: 100%;
            height: 100%;
            background-color: rgba(10, 230, 215, 70%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        p{
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Coba Background Attachment</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod, reiciendis.</p>
    <div class="kotak">
        <div class="content">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod, reiciendis.</p>
        </div>
    </div>
</body>
</html>
