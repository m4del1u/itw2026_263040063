<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Backgrounds</title>
    <style>
        body {
            background-color: lightblue;
            background-image: url(img/Frank\ Ocean.jpg), url(img/Artist.jpg);
            background-repeat: no-repeat, no-repeat;
            background-position: center, right;
            min-height: 100vh;
        }

        .frame {
            width: 300px;
            height: 200px;
            background-color: rgb(244, 15, 172);
            background-image: url(img/Artist.jpg), url(img/Frank\ Ocean.jpg);
            background-size: cover, contain;
            background-repeat: no-repeat, no-repeat;
            background-position: center, left;
        }
    </style>
</head>
<body>
    <h1>My Profile Card</h1>
    <div class="frame">
</body>
</html>
