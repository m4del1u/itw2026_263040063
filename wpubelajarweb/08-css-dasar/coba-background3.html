<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Background</title>
  <style>
    body {
      background-color: rgb(230, 197, 173);
      background-image: linear-gradient(to right, rgb(176, 9, 37), rgb(207, 230, 173));
      height: 100vh;
    }

    .kotak1 {
      width: 300px;
      height: 300px;
      background-color: rgb(241, 78, 151);
      background-image: linear-gradient(to bottom, lightblue, rgb(239, 250, 114));
    }

    .kotak2 {
      width: 300px;
      height: 300px;
      background-color: rgb(250, 114, 177);
      background-image: radial-gradient(red, rgb(0, 179, 255));
    }

    .kotak3 {
      width: 300px;
      height: 300px;
      background-color: rgb(248, 36, 153);
      background-image: conic-gradient(rgb(251, 0, 255), rgb(17, 176, 219), rgb(206, 220, 5));
    }
  </style>
</head>

<body>
  <div class="kotak1"></div>
  <div class="kotak2"></div>
  <div class="kotak3"></div>
</body>

</html>
